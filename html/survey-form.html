<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Survey Form</title>
    </head>
    <body>
        <header>
             <h1 id="title">freeCodeCamp Survey Form</h1>
             <p id="description">Thank you for taking the time to help us improve the platform </p>
        </header>

        <main>
            <form id="survey-form" method="GET">
            <section>
                <label for="name" id="name-label">Name</label>
                <input type="text" id="name" placeholder="eg. John" required/><br>
                <label for="email" id="email-label">Email</label>
                <input type="email" id="email" minlength="8" placeholder="eg. example@email.com" required><br>
                <label for="number" id="number-label">Age(optional)</label>
                <input type="number" id="number" min="16" max="100" placeholder="22">
            </section><br>

            <section>
                <label for="dropdown">Which option best describes your current role?</label><br>
                <select id="dropdown">
                    <option disabled selected>Select current role</option>
                    <option >Student</option>
                    <option>Full Time Job</option>
                    <option>Full Time Learner</option>
                    <option>Prefer not to say</option>
                    <option>Other</option>
                </select>
            </section><br>

            <section>
                <label >Would you recommend freeCodeCamp to a friend?</label><br>
                <input type="radio" name="reccomend" value="Definitely">
                <label>Definitely </label>
                <input type="radio" name="reccomend" value="Maybe">
                <label>Maybe </label>
                <input type="radio" name="reccomend" value="Not sure"> 
                <label>Not sure </label>
            </section><br>

            <section>
                <label>What is your favorite feature of freeCodeCamp?</label><br>
                 <select id="">
                    <option disabled selected>Select an option</option>
                    <option>Challenges</option>
                    <option>Projects</option>
                    <option>Community</option>
                    <option>Open Source</option>
                </select>
            </section><br>

            <section>
                <label>What would you like to see improved? (Check all that apply)</label><br>
                <input type="checkbox" value="Front-end Projects"/>
                <label>Front-end Projects</label>
                <input type="checkbox"  value="Back-end Projects"/>
                <label>Back-end Projects</label>
                <input type="checkbox" value="Data Visualization"/>
                <label>Data Visualization</label>
                <input type="checkbox" value="Challenges"/>
                <label>Challenges</label>
                <input type="checkbox" value="Open Source Community"/>
                <label>Open Source Community</label>
                <input type="checkbox" value="Gitter help rooms"/>
                <label>Gitter help rooms</label>
                <input type="checkbox" value="Videos"/>
                <label>Videos</label>
                <input type="checkbox" value="City Meetups"/>
                <label>City Meetups</label>
                <input type="checkbox" value="Wiki"/>
                <label>Wiki</label>
                <input type="checkbox" value="Forum"/>
                <label>Forum</label>
                <input type="checkbox" value="Additional Courses"/>
                <label>Additional Courses</label>
            </section><br>

            <section>
                <label>Any comments or suggestions?</label><br><br>
                <textarea placeholder="Enter your comment here..."></textarea>
            </section>

            <button type="submit" id="submit">Submit</button>
        </form>
        </main>
       
    </body>
</html>
