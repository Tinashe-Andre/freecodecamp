<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Checkout Page</title>
    </head>
    <body>
        <h1>Checkout</h1>

        <section>
            <h2>Your Cart</h2>
            <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg"/ alt="Colourful Rubix Cube"/>
            <p>Rubix Cube</p>
            <span>$29.99</span>
        </section>

        <section>
            <h2>Payment Information</h2>
            <form method="POST">
                <label for="card-name">Card Name <span aria-hidden="true">*</span></label>
                <input id="card-name" name="card-name" type="text" required/><br>
                <label for="card-number">Card Number <span aria-hidden="true">*</span></label>
                <input id="card-number" name="card-number" type="text" aria-describedby="card-number-help" required/>
                <p id="card-number-help">Please enter your 16-digit card number without spaces or dashes.</p>
                <label for="expiry-date">Expiry Date <span aria-hidden="true">*</span></label>
                <input id="expiry-date" name="expiry-date" type="text" placeholder="MM/YY" required/><br>
                <label for="cvv">CVV <span aria-hidden="true">*</span></label>
                <input id="cvv" name="cvv" type="text" required/><br>
                <button type="submit">Place Order</button>
            </form>
        </section>
    </body>
</html>
